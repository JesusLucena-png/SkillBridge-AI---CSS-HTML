<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="GuestHeader.CSS">

    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

</head>
<body>
    <header id="header" class="header">

        <div id="logo-container" class="header__logo"> 
            <img id="logo" class="header__logo-img" src="../../Img/Vector.jpg" alt="Logo">
        </div>

        <div id="logo-container-2" class="header__logo">
            <img id="logo" class="header__logo-img" src="../../Img/Group 23.jpg" alt="Logo">
        </div>

        <nav id="nav" class="header__nav">
            <ul class="header__menu">
                <li class="header__menu-item">
                    <a href="#inicio">Inicio</a>
                </li>
                <li class="header__menu-item">
                    <a href="#servicios">Servicios</a>
                </li>
                <li class="header__menu-item">
                    <a href="#registros">Registros</a>
                </li>
                <li class="header__menu-item">
                    <i class="bx bx-sparkles-alt"></i>
                    <a href="#asistente">Asistente IA</a>
                </li>
            </ul>
        </nav>

        <div class="header__actions">
            <a href="#iniciar" class="header__login">Iniciar</a>
            <button id="register-btn" class="header__register-btn">
                Registrarse
            </button>
        </div>

        <div id="actions-login" class="header__actions-login">
            <div class="header__actions-login-container">
                <div class="header__actions-login-info">
                    <span class="header__actions-login-name">Admin User</span>
                    <samp class="header__actions-login-role">Admin</samp>
                </div>
                <div class="header__actions-login-icon">
                    <img src="../../Img/Vector.jpg" alt="User Icon">
                </div>
            </div>
            <div class="header__actions-login-logout">
                <i class="bx bx-arrow-out-right-square-half"></i>
            </div>
        </div>

        <div class="header__menu-toggle" id="menu-toggle">
            <i class="bx bx-menu"></i>
        </div>
    </header>
</body>
</html>
